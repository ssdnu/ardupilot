name: Build & Release FTS ArduPilot Firmware

# 사용법:
#   1. 이 파일을 ssdnu/ardupilot 레포의 .github/workflows/build-release.yml 로 저장
#   2. Actions 탭에서 수동 실행 (workflow_dispatch) 하거나
#      v4.6.2 태그를 push 하면 자동 실행됨
#   3. 완료되면 릴리스 2개가 각각 생성됨 (재실행 시 각각 덮어씀)
#        Releases > v4.6.2-v5  (v5, v5-ext-compass 보드용)
#          v5-arducopter.apj / v5-arduplane.apj / v5-ardurover.apj / v5-ardusub.apj
#          v5-ext-compass-arducopter.apj / v5-ext-compass-arduplane.apj / v5-ext-compass-ardurover.apj / v5-ext-compass-ardusub.apj
#          v5-bootloader.bin
#        Releases > v4.6.2-v7  (v7 보드용)
#          v7-arducopter.apj / v7-arduplane.apj / v7-ardurover.apj / v7-ardusub.apj
#          v7-bootloader.bin
#
#   매뉴얼 PDF에는 보드별로 아래 링크를 넣으면 됨:
#     V5: https://github.com/ssdnu/ardupilot/releases/tag/v4.6.2-v5
#     V7: https://github.com/ssdnu/ardupilot/releases/tag/v4.6.2-v7

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG_V5: v4.6.2-v5
  RELEASE_TAG_V7: v4.6.2-v7

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        board:
          - { hwdef: FTS_FC_V5,             prefix: v5 }
          - { hwdef: FTS_FC_V5_EXT_COMPASS, prefix: v5-ext-compass }
          - { hwdef: FTS-FC-V7,             prefix: v7 }
        vehicle:
          - { target: copter, bin: arducopter, label: ArduCopter }
          - { target: plane,  bin: arduplane,  label: ArduPlane }
          - { target: rover,  bin: ardurover,  label: ArduRover }
          - { target: sub,    bin: ardusub,    label: ArduSub }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Configure board
        run: |
          ./waf configure --board "${{ matrix.board.hwdef }}"

      - name: Build ${{ matrix.vehicle.label }}
        run: |
          ./waf ${{ matrix.vehicle.target }}

      - name: Locate build output
        id: locate
        run: |
          APJ=$(find build/${{ matrix.board.hwdef }}/bin -name "${{ matrix.vehicle.bin }}.apj")
          echo "apj_path=$APJ" >> "$GITHUB_OUTPUT"

      - name: Rename output
        run: |
          mkdir -p out
          cp "${{ steps.locate.outputs.apj_path }}" "out/${{ matrix.board.prefix }}-${{ matrix.vehicle.bin }}.apj"

      - name: Upload build artifact (between jobs)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board.hwdef }}-${{ matrix.vehicle.target }}
          path: out/*.apj
          retention-days: 7

  build-bootloader:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:latest
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        board:
          - { hwdef: FTS_FC_V5,  asset: v5-bootloader }
          - { hwdef: FTS-FC-V7,  asset: v7-bootloader }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Configure board (bootloader)
        run: |
          ./waf configure --board "${{ matrix.board.hwdef }}" --bootloader

      - name: Build bootloader
        run: |
          ./waf bootloader

      - name: Locate build output
        id: locate
        run: |
          BIN=$(find build/${{ matrix.board.hwdef }}/bin -name "AP_Bootloader.bin")
          echo "bin_path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Rename output
        run: |
          mkdir -p out
          cp "${{ steps.locate.outputs.bin_path }}" "out/${{ matrix.board.asset }}.bin"

      - name: Upload build artifact (between jobs)
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-${{ matrix.board.hwdef }}
          path: out/*.bin
          retention-days: 7

  release-v5:
    needs: [build, build-bootloader]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (for commit info)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten V5 artifacts
        run: |
          mkdir -p release-assets-v5
          find artifacts -type f \( -name "v5-*.apj" -o -name "v5-*.bin" \) -exec cp {} release-assets-v5/ \;
          ls -la release-assets-v5

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create / update V5 release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG_V5 }}
          name: "Ardupilot release (${{ env.RELEASE_TAG_V5 }} dev)"
          body: |
            ArduPilot 4.6.2 기반 FTS FC-V5 커스텀 펌웨어 (ArduCopter / ArduPlane / ArduRover / ArduSub)

            - 소스 커밋: ${{ steps.vars.outputs.sha_short }}
            - 빌드 일시: ${{ github.event.repository.updated_at }}
            - 보드: FTS_FC_V5, FTS_FC_V5_EXT_COMPASS

            ※ 반드시 이 릴리스의 파일만 사용하십시오. 다른 출처의 펌웨어를 올리면 보드가 정상 동작하지 않을 수 있습니다.
          artifacts: "release-assets-v5/*"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: false

  release-v7:
    needs: [build, build-bootloader]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (for commit info)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten V7 artifacts
        run: |
          mkdir -p release-assets-v7
          find artifacts -type f \( -name "v7-*.apj" -o -name "v7-*.bin" \) -exec cp {} release-assets-v7/ \;
          ls -la release-assets-v7

      - name: Get short commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create / update V7 release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG_V7 }}
          name: "Ardupilot release (${{ env.RELEASE_TAG_V7 }} dev)"
          body: |
            ArduPilot 4.6.2 기반 FTS FC-V7 커스텀 펌웨어 (ArduCopter / ArduPlane / ArduRover / ArduSub)

            - 소스 커밋: ${{ steps.vars.outputs.sha_short }}
            - 빌드 일시: ${{ github.event.repository.updated_at }}
            - 보드: FTS-FC-V7
            - 부트로더 board ID 2001 (구 부트로더 1010 보드는 부트로더 재플래싱 필요)

            ※ 반드시 이 릴리스의 파일만 사용하십시오. 다른 출처의 펌웨어를 올리면 보드가 정상 동작하지 않을 수 있습니다.
          artifacts: "release-assets-v7/*"
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: false
